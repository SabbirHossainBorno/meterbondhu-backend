# ═══════════════════════════════════════════════════════════════════
# Build & Push Docker Image
# ═══════════════════════════════════════════════════════════════════
# Trigger:
#   - main branch e push → production image build
#   - staging branch e push → staging image build
#   - Manual trigger (Actions tab theke)
#
# Output:
#   - ghcr.io/sabbirhossainborno/meterbondhu-backend:main-<sha>
#   - ghcr.io/sabbirhossainborno/meterbondhu-backend:staging-<sha>
# ═══════════════════════════════════════════════════════════════════

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      # Docs change hole build trigger hobe na
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual trigger'

# ─── Environment variables ─────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─── Jobs ──────────────────────────────────────────────────────────
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # ─── Permissions for GHCR push ─────────────────────────────────
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # ─── 1. Checkout code ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Setup Docker Buildx ──────────────────────────────────
      # Buildx = advanced Docker builder with caching support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── 3. Login to GitHub Container Registry ───────────────────
      # GITHUB_TOKEN automatically provided by GitHub, no manual secret
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── 4. Extract metadata (tags, labels) ──────────────────────
      # Ei step image er tags banay
      # e.g., main branch push → tags: [main, main-abc1234, latest]
      #       staging push → tags: [staging, staging-abc1234]
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ─── 5. Build and push Docker image ──────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache use — rebuild 5-10x faster
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ─── 6. Print summary ────────────────────────────────────────
      - name: Image digest
        run: echo "✅ Image pushed successfully! Tags: ${{ steps.meta.outputs.tags }}"
